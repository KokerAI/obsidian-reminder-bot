[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-reminder-bot"
version = "1.4.4"
description = "Личный Telegram-бот для отслеживания дедлайнов из Obsidian"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [
  { name = "KokerAI" }
]


dependencies = [
  "aiogram>=3.30.0",
  "APScheduler>=3.11.3",
  "aiohttp>=3.14.3",
  "PyYAML>=6.0.3",
  "python-dotenv>=1.2.2",
  "watchdog>=6.0.0"
]

[tool.setuptools]
py-modules = ["bot", "config", "obsidian_parser", "utils"]